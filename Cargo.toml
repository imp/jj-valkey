[package]
name = "jj-valkey"
version = "0.31.0"
edition = "2024"
license = "Apache-2.0"


[dependencies]
async-trait = "0.1"
clap = { version = "4.5", features = [
    "derive",
    "deprecated",
    "wrap_help",
    "string",
] }
dunce = "1.0"
futures = "0.3"
pollster = "0.4"
redis = { version = "0.32", features = ["tokio-comp"] }
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
tokio = { version = "1.47", features = ["io-util"] }
toml_edit = { version = "0.23", features = ["serde"] }

# Jujutsu core dependencies
jj-lib = { version = "0.31", git = "https://github.com/jj-vcs/jj" }
jj-cli = { version = "0.31", git = "https://github.com/jj-vcs/jj" }
